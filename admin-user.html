<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PRIMASIS - DATABASE USER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>HALAMAN DATABASE USER</h2>
        
        <div class="btn-group">
            <button onclick="enableEdit()">Edit</button>
            <button onclick="addNewRow()">Add</button>
            <button onclick="saveAll()" class="btn-success">Save</button>
            <button onclick="toggleDeleteMode()" class="btn-warning" id="btnDelete">Delete</button>
            <a href="admin.html" class="btn btn-secondary">Back</a>
            <button onclick="logout()" class="btn-danger">EXIT</button>
        </div>

        <table id="userTable">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Nama</th>
                    <th>PIC</th>
                    <th>No. HP</th>
                    <th>Alamat</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Hak Akses</th>
                    <th class="col-select" style="display:none;">Pilih</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="js/data.js"></script>
    <script>
        checkAccess("admin");
        let isEditable = false;
        let deleteMode = false;

        function renderTable() {
            const users = getUsers();
            const tbody = document.querySelector("#userTable tbody");
            tbody.innerHTML = "";

            // Atur visibilitas header kolom "Pilih"
            const colSelectHeaders = document.querySelectorAll("th.col-select");
            colSelectHeaders.forEach(th => {
                th.style.display = deleteMode ? "" : "none";
            });

            users.forEach((u, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td contenteditable="${isEditable}">${u.id}</td>
                    <td contenteditable="${isEditable}">${u.nama}</td>
                    <td contenteditable="${isEditable}">${u.pic}</td>
                    <td contenteditable="${isEditable}">${u.hp}</td>
                    <td contenteditable="${isEditable}">${u.alamat}</td>
                    <td contenteditable="${isEditable}">${u.username}</td>
                    <td contenteditable="${isEditable}">${u.password}</td>
                    <td contenteditable="${isEditable}">${u.hakAkses}</td>
                    <td class="col-select" style="${deleteMode ? '' : 'display:none;'}">
                        <input type="checkbox" class="chk-del" data-index="${i}">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function enableEdit() {
            isEditable = true;
            renderTable();
        }

        function addNewRow() {
            isEditable = true;
            const tbody = document.querySelector("#userTable tbody");
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td contenteditable="true">mitra_${Date.now().toString().slice(-3)}</td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true"></td>
                <td contenteditable="true">mitra</td>
                <td class="col-select" style="${deleteMode ? '' : 'display:none;'}">
                    <input type="checkbox" class="chk-del">
                </td>
            `;
            tbody.appendChild(tr);
        }

        function saveAll() {
            const rows = document.querySelectorAll("#userTable tbody tr");
            let newUsers = [];
            let valid = true;

            rows.forEach(row => {
                const cells = row.querySelectorAll("td");
                const u = {
                    id: cells[0].innerText.trim(),
                    nama: cells[1].innerText.trim(),
                    pic: cells[2].innerText.trim(),
                    hp: cells[3].innerText.trim(),
                    alamat: cells[4].innerText.trim(),
                    username: cells[5].innerText.trim(),
                    password: cells[6].innerText.trim(),
                    hakAkses: cells[7].innerText.trim()
                };

                if (!u.id || !u.nama || !u.pic || !u.hp || !u.alamat || !u.username || !u.password || !u.hakAkses) {
                    valid = false;
                }
                newUsers.push(u);
            });

            if (!valid) {
                alert("Mohon isi data dengan lengkap!");
                return;
            }

            saveUsers(newUsers);
            isEditable = false;
            renderTable();
            alert("Data User berhasil disimpan!");
        }

        function toggleDeleteMode() {
            deleteMode = !deleteMode;

            // Jika tombol Delete diklik saat mode aktif (artinya selesai memilih dan ingin menghapus)
            if (!deleteMode) {
                const checkboxes = document.querySelectorAll(".chk-del:checked");
                if (checkboxes.length > 0) {
                    if (confirm("Apakah Anda yakin ingin menghapus data/baris yang dipilih?")) {
                        const indicesToDelete = Array.from(checkboxes)
                            .map(c => parseInt(c.dataset.index))
                            .filter(idx => !isNaN(idx));
                        
                        let users = getUsers();
                        // Filter data yang indeksnya tidak ada di dalam daftar hapus
                        users = users.filter((_, idx) => !indicesToDelete.includes(idx));
                        saveUsers(users);
                    }
                }
            }

            renderTable();

            // Ubah teks tombol secara opsional untuk kenyamanan pengguna
            const btnDelete = document.getElementById("btnDelete");
            btnDelete.innerText = deleteMode ? "Done Delete" : "Delete";
        }

        // Inisialisasi awal saat halaman dimuat
        renderTable();
    </script>
</body>
</html>
